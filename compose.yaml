name: agentcloud-sim
services:
  backend:
    build: .
    image: agentcloud-backend:local
    ports:
      - "127.0.0.1:${AGENTCLOUD_SIM_PORT:-3002}:3000"
    environment:
      BETTER_AUTH_URL: http://127.0.0.1:${AGENTCLOUD_SIM_PORT:-3002}
      AGENTCLOUD_DATA_DIR: /data
      AGENTCLOUD_MAIL_MODE: local
      AGENTCLOUD_REMOTE_BACKEND_URL: ""
    volumes:
      - backend-data:/data
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/sign-in').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
volumes:
  backend-data:
